<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100c">
<title>Elorin Market</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Elorin <span>Market</span></div>
    <nav class="tabs" id="tabs">
      <button data-window="day" class="active">Day</button>
      <button data-window="week">Week</button>
      <button data-window="month">Month</button>
    </nav>
    <nav class="nav">
      <a href="index.html" class="active">Dashboard</a>
      <a href="players.html">Players</a>
    </nav>
    <input id="search" type="search" placeholder="Search items…" autocomplete="off" spellcheck="false">
    <button id="reload" class="ghost" title="Reload">⟳</button>
  </div>
  <div class="status" id="status">loading…</div>
</header>

<main>
  <section class="panel">
    <h2>Best investments
      <span class="hint" id="feeHint"></span>
    </h2>
    <div class="cards" id="best"></div>
  </section>

  <section class="panel">
    <h2>Items <span class="hint" id="itemsHint"></span></h2>
    <div class="tableWrap">
      <table id="items">
        <thead>
          <tr>
            <th class="sortable" data-key="name">Item</th>
            <th class="sortable num" data-key="last">Last</th>
            <th class="sortable num" data-key="low">Low</th>
            <th class="sortable num" data-key="median">Median</th>
            <th class="sortable num" data-key="high">High</th>
            <th class="sortable num" data-key="n">Seen</th>
            <th class="sortable num" data-key="pct">Margin</th>
          </tr>
        </thead>
        <tbody id="itemsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Insights</h2>
    <div id="insights"></div>
  </section>
</main>

<div id="detail" class="modal hidden" aria-hidden="true">
  <div class="sheet" id="detailSheet"></div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
