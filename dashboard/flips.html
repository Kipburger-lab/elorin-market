<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#12100c">
<title>Elorin Market — Flips</title>
<link rel="stylesheet" href="styles.css">
<style>
  #tools input {
    width: 68px;
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 6px;
    color: var(--text);
    padding: 4px 6px;
    font: inherit;
    margin-left: 4px;
  }
  #flipsBody tr { cursor: pointer; }
  #flipsBody tr:hover { background: rgba(255, 207, 92, 0.06); }
  #notes { color: var(--dim); font-size: 12px; line-height: 1.6; }
  #notes b { color: var(--text); }
</style>
</head>
<body>
<header>
  <div class="bar">
    <div class="brand">Elorin <span>Market</span></div>
    <nav class="tabs" id="tabs">
      <button data-window="week" class="active">Week</button>
      <button data-window="month">Month</button>
    </nav>
    <nav class="nav">
      <a href="index.html">Dashboard</a>
      <a href="players.html">Players</a>
      <a href="flips.html" class="active">Flips</a>
    </nav>
    <input id="search" type="search" placeholder="Search items…" autocomplete="off" spellcheck="false">
    <button id="reload" class="ghost" title="Reload">⟳</button>
  </div>
  <div class="status" id="status">loading…</div>
</header>

<main>
  <section class="panel">
    <h2>Realistic flips
      <span class="hint">buy at the 10th percentile · sell at the median · outliers and one-off listings dropped</span>
    </h2>
    <div id="tools" style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 10px">
      <label class="hint">min sightings <input id="minObs" type="number" min="1" step="1" value="12"></label>
      <label class="hint">max median swing % <input id="maxCv" type="number" min="1" max="300" step="1" value="35"></label>
      <label class="hint">min buckets <input id="minBuckets" type="number" min="2" step="1" value="3"></label>
      <span class="hint" id="count"></span>
    </div>
    <div class="tableWrap">
      <table id="flips">
        <thead>
          <tr>
            <th class="sortable" data-key="name">Item</th>
            <th class="sortable num" data-key="buy">Buy ≤ (p10)</th>
            <th class="sortable num" data-key="sell">Sell ~ (median)</th>
            <th class="sortable num" data-key="profit">Profit</th>
            <th class="sortable num" data-key="pct">Margin</th>
            <th class="sortable num" data-key="n">Seen</th>
            <th class="sortable num" data-key="buckets">Buckets</th>
            <th class="sortable num" data-key="priceCv">Price σ</th>
            <th class="sortable num" data-key="volCv">Volume σ</th>
          </tr>
        </thead>
        <tbody id="flipsBody"></tbody>
      </table>
    </div>
  </section>

  <section class="panel">
    <h2>Method</h2>
    <div id="notes"></div>
  </section>
</main>

<div id="detail" class="modal hidden" aria-hidden="true">
  <div class="sheet" id="detailSheet"></div>
</div>

<script src="config.js"></script>
<script src="flips.js"></script>
</body>
</html>
